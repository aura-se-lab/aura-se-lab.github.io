# Statement shown on the homepage (kept verbatim from the original site)
statement: >-
  The AURA Lab, founded in Fall 2024, advances research at the intersection of
  efficiency, automation, and explainability in software engineering. Our mission
  is to design innovative and responsible AI-driven solutions that improve
  developer productivity while addressing key challenges of transparency and
  resource efficiency. Through rigorous methods, open collaboration, and a
  commitment to impactful work, the AURA Lab contributes practical advances in
  AI-supported software engineering for academia, industry, and society.

# The three-line "abstract" used in hero/OG cards
brief:
  - "AI systems that write our software should be cheap enough to deploy, honest about what they do not know, and accountable when they fail."

funding:
  - id: nsf-crii-2451058
    program: "NSF CISE Research Initiation Initiative (CRII)"
    agency: NSF / CISE
    award: "2451058"
    title: "CRII: SHF: Advancing Sustainable Software Engineering Practices with Energy-Efficient Large Language Models for Code"
    amount: "$175,000"
    period: "06/2025 – 05/2027"
    role: "Sole PI"
    status: active
    url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=2451058
    summary: >-
      A two-year initiation award supporting research on reducing the compute,
      energy, and carbon cost of training and deploying Large Language Models for
      Code — through task-aware training-data optimization and model compression
      (quantization) for software engineering.
  - id: charles-center
    program: "W&M Charles Center Summer Research Grants"
    agency: William & Mary
    title: "Undergraduate research on AI optimization & resource-efficient code intelligence"
    amount: "2 × $4,000"
    period: "2025 · 2026"
    role: "Faculty mentor"
    status: awarded
    url: https://www.wm.edu/as/charlescenter/
    summary: >-
      Two summers of Charles Center funding supporting undergraduate research on
      neural compression, LoRA-style fine-tuning, and code-quality evaluation
      under model-topology changes.

