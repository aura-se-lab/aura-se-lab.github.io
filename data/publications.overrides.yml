# ─────────────────────────────────────────────────────────────────────────────
# Human overrides for the publications pipeline. Everything here wins over
# what the online sources say. Entries are matched by key (see
# src/data/publications.json), or by doi / arxiv / title given inside the patch.
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  # Papers before this date are not lab output unless force-included below
  # (YYYY or YYYY-MM; a paper whose month is unknown in its first year is kept).
  since: 2024-09

# Force-include specific papers regardless of date (e.g. PI work that seeded a thread)
include: []
#  - doi: 10.1145/3597503.3623351

# Hide papers that the sources attribute to us wrongly (namesakes, errata, duplicates)
exclude: []
#  - title: "Some paper by a different Mastropaolo"

entries:
  # ── examples ──────────────────────────────────────────────────────────────
  # afrin2025quantization:
  #   selected: true
  #   award: "Distinguished Paper Award"
  #   code: https://github.com/aura-se-lab/quantization-study
  #   threads: [efficient-models]
  #   venue: ICSME              # force a venue key from data/venues.yml
  #   status: published         # published | accepted | preprint

  # The neurosymbolic position paper appeared in the AI-SDLC workshop (FSE'25 companion)
  mastropaolo2025path:
    venue: AI-SDLC
    type: workshop
    selected: true

  # Accepted at ASE 2026; the ACM DOI is the proceedings, so the sources still
  # carry it as the arXiv preprint.
  nguyen2026pattern:
    venue: ASE
    type: conference
    status: accepted
    selected: true

  # The multilingual prompt benchmark — Saima's, with the Molise/Andes/NC State
  # group. Accepted at TOSEM on 16 Aug 2026 (TOSEM-2025-0896.R2); the arXiv
  # version is still the only artifact, so the cover is the preprint's.
  afrin2026large:
    venue: TOSEM
    type: journal
    status: accepted
    selected: true

  # Multi-task QLoRA — Alvi's first as lead author. Accepted at TOSEM on
  # 26 Aug 2026 (TOSEM-2026-0062.R2).
  haque2026parameter:
    venue: TOSEM
    type: journal
    status: accepted
    selected: true

  # Accepted to the ICSME 2026 research track on 28 May 2026 (paper 3663).
  afrin2026quantize:
    venue: ICSME
    type: conference
    status: accepted
