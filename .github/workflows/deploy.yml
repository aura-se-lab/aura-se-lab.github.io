name: Deploy (Cloudflare)

# main → auralab.sh (production)
# pull requests → a preview URL posted as a PR comment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # forks have no secrets; skip quietly
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build (production URL)
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Build (preview URL)
        if: github.event_name == 'pull_request'
        run: SITE_URL=https://auralab-site.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev npm run build

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🔍 **Preview deployed** for ${{ github.event.pull_request.head.sha }}

            ${{ steps.preview.outputs.deployment-url || 'See the wrangler step output for the preview URL.' }}
