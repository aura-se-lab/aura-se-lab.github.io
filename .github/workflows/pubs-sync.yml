name: Publications sync

# Weekly: collect papers from DBLP / Crossref / Semantic Scholar / OpenAlex / arXiv,
# merge, and open (or update) a pull request with the diff + drafted news posts.
# Nothing is merged automatically — a human reviews the PR.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list of sources (default: all)"
        required: false
        default: ""
      scholar:
        description: "Also query Google Scholar (slow, fragile)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pubs/requirements.txt

      - run: pip install -r scripts/pubs/requirements.txt

      - name: Install scholarly (optional)
        if: inputs.scholar
        run: pip install scholarly

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pubs-cache-${{ github.run_id }}
          restore-keys: pubs-cache-

      - name: Run sync
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PUBS_MAILTO: aura.se.lab@gmail.com
        run: |
          ARGS="--max-age 3600"
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ "${{ inputs.scholar }}" = "true" ]; then ARGS="$ARGS --scholar"; fi
          python3 scripts/pubs/sync.py $ARGS

      - name: Build site to make sure the new data renders
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Prepare PR body
        id: body
        run: |
          {
            echo "body<<EOF"
            cat data/sync-report.md
            echo
            echo "---"
            echo "_Opened automatically by the **Publications sync** workflow. Edit \`data/publications.overrides.yml\` or \`data/publications.local.bib\` to correct anything, then push to this branch; the site rebuilds on merge._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/pubs-sync
          delete-branch: true
          commit-message: "chore(pubs): weekly publications sync"
          title: "📚 Publications sync — ${{ github.run_started_at }}"
          body: ${{ steps.body.outputs.body }}
          labels: publications, automated
          add-paths: |
            src/data/publications.json
            src/data/metrics.json
            public/aura.bib
            data/sync-report.md
            src/content/news/*.md
          author: AURA Lab bot <aura.se.lab@gmail.com>
          committer: AURA Lab bot <aura.se.lab@gmail.com>
